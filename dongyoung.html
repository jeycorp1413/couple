<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>동영 &amp; 지영 — 우리 캘린더</title>
<link rel="manifest" href="manifest-dongyoung.webmanifest?v=1">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 캘린더">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="icon-192.png?v=4">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* =====================================================================
     동영 & 지영 · 디자인 토큰 (Toss 구조 × Apple HIG 마감)
     - 타이포: SF Pro 계열 시스템 폰트, 큰 숫자는 자간 좁게, 굵기 대비로 위계
     - 소재: 흰 카드 + 아주 부드러운 그림자, 유리(blur/vibrancy) 탭바·헤더
     - 색: 화이트/다크 기반, iOS 시스템 블루 포인트, 사람 구분은 오렌지·블루 점
     ===================================================================== */
  :root{
    --font:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    --bg:#F2F2F7; --card:#FFFFFF;
    --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.08); --fill3:rgba(120,120,128,.20);
    --ink:#1C1C1E; --t2:rgba(60,60,67,.62); --t3:rgba(60,60,67,.38); --t4:rgba(60,60,67,.22);
    --sep:rgba(60,60,67,.14);
    --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
    --a:#FF9500; --b:#007AFF; --both:#5856D6;
    --red:#FF3B30; --green:#34C759; --yellow:#FFCC00;
    --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --sh-lg:0 12px 40px rgba(0,0,0,.14);
    --glass:rgba(255,255,255,.72); --glass-b:rgba(60,60,67,.12);
    --ov:rgba(0,0,0,.32);
    --r:16px; --r-lg:20px; --r-sm:12px;
    --ease:cubic-bezier(.22,1,.36,1);
    /* 인라인 JS가 참조하던 옛 변수명 → 새 토큰으로 연결 */
    --pink:var(--accent); --pink-deep:var(--accent); --blue:var(--b); --blue-deep:var(--b); --line:var(--sep); --muted:var(--t2);
  }
  body.night{
    --bg:#000000; --card:#1C1C1E;
    --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16); --fill3:rgba(120,120,128,.32);
    --ink:#F2F2F7; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.36); --t4:rgba(235,235,245,.22);
    --sep:rgba(84,84,88,.5);
    --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18);
    --a:#FF9F0A; --b:#0A84FF; --both:#5E5CE6;
    --red:#FF453A; --green:#30D158; --yellow:#FFD60A;
    --sh:0 1px 2px rgba(0,0,0,.4); --sh-lg:0 12px 40px rgba(0,0,0,.6);
    --glass:rgba(28,28,30,.72); --glass-b:rgba(84,84,88,.5); --ov:rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    body{
      --bg:#000000; --card:#1C1C1E;
      --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.16); --fill3:rgba(120,120,128,.32);
      --ink:#F2F2F7; --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.36); --t4:rgba(235,235,245,.22);
      --sep:rgba(84,84,88,.5);
      --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18);
      --a:#FF9F0A; --b:#0A84FF; --both:#5E5CE6;
      --red:#FF453A; --green:#30D158; --yellow:#FFD60A;
      --sh:0 1px 2px rgba(0,0,0,.4); --sh-lg:0 12px 40px rgba(0,0,0,.6);
      --glass:rgba(28,28,30,.72); --glass-b:rgba(84,84,88,.5); --ov:rgba(0,0,0,.5);
    }
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0; font-family:var(--font); font-size:15px; line-height:1.45; letter-spacing:-.01em;
    background:var(--bg); color:var(--ink); min-height:100vh; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px; margin:0 auto;
    padding:calc(8px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));}

  /* ---------- 상단 라지 타이틀 ---------- */
  .top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:18px 0 14px;}
  .top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1.1; color:var(--ink);}
  .top h1 .h,.top h1 .y{color:var(--ink);}
  .top h1 .amp{color:var(--t3); font-weight:500; margin:0 7px;}
  .gear{border:0; background:var(--fill); color:var(--t2); border-radius:50%; width:34px; height:34px; cursor:pointer; flex:none; display:grid; place-items:center; padding:0;}
  .gear svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .live{display:none;}
  .warn{background:rgba(255,204,0,.18); color:#8a6d00; border-radius:var(--r-sm); padding:11px 13px; font-size:13px; margin-bottom:14px; display:none;}
  .empty{color:var(--t3); font-size:14px; padding:8px 2px;}

  /* ---------- 히어로 (함께한 지 N일 + 다음 마일스톤 진행바) ---------- */
  .hero{position:relative; background:var(--card); border-radius:var(--r-lg); padding:22px 22px 20px; margin-bottom:14px; box-shadow:var(--sh);}
  .hero .lbl{font-size:13px; font-weight:600; color:var(--t2); letter-spacing:0;}
  .hero .big{font-size:56px; font-weight:700; letter-spacing:-.045em; line-height:1; margin:6px 0 5px; font-variant-numeric:tabular-nums; color:var(--ink);}
  .hero .big b{font-weight:700;}
  .hero .big small{font-size:20px; font-weight:600; color:var(--t2); margin-left:4px; letter-spacing:-.01em;}
  .hero .sub{display:block; font-size:13px; color:var(--t3); font-weight:500; font-variant-numeric:tabular-nums;}
  .hero .bar{height:6px; border-radius:3px; background:var(--fill); margin-top:16px; overflow:hidden;}
  .hero .bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:3px; transition:width .8s var(--ease);}
  .hero .foot{display:flex; justify-content:space-between; margin-top:8px; font-size:12px; font-weight:600; color:var(--t2); font-variant-numeric:tabular-nums;}
  .hero .fh,.hero .frost{display:none;}

  /* ---------- 스토리(추억) 링 ---------- */
  .stories{display:flex; gap:14px; overflow-x:auto; padding:2px 2px 16px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .stories::-webkit-scrollbar{display:none;}
  .stories .story{flex:none; width:60px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
  .stories .ring{width:60px; height:60px; border-radius:50%; padding:2px; background:var(--fill3);}
  .stories .ring.add{background:var(--accent-soft);}
  .stories .ring .rin{width:100%; height:100%; border-radius:50%; border:2px solid var(--card); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden; color:var(--accent); font-weight:500;}
  .stories .ring .rin img{width:100%; height:100%; object-fit:cover;}
  .stories .slbl{font-size:11px; font-weight:500; color:var(--t2); max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums;}

  /* ---------- 카드 · 섹션 제목 ---------- */
  .card{background:var(--card); border-radius:var(--r); padding:18px 18px 16px; margin-bottom:14px; box-shadow:var(--sh); border:0;}
  .sec-title{font-weight:700; font-size:17px; margin:0 0 12px; letter-spacing:-.02em; display:flex; align-items:center; gap:7px; color:var(--ink);}
  .sec-title.fold-head{cursor:pointer; margin-bottom:0; -webkit-user-select:none; user-select:none;}
  .fold{margin-left:auto; color:var(--t3); font-size:15px; line-height:1;}
  .fold-body{margin-top:12px;}
  #tripBody{margin-top:14px;}
  #photoList{margin-top:12px;}
  .mini-add{margin-left:auto; border:0; background:var(--accent-soft); color:var(--accent); font:inherit; font-size:13px; font-weight:600; border-radius:999px; padding:6px 12px; cursor:pointer;}

  /* ---------- 기념일 목록 ---------- */
  .anniv{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--sep);}
  .anniv:last-child{border-bottom:0;}
  .anniv .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .anniv .al{flex:1; font-size:15px; font-weight:500; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .anniv .al small{font-weight:500; color:var(--t3); font-size:12.5px; font-variant-numeric:tabular-nums;}
  .anniv .ad{font-size:15px; font-weight:700; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .anniv .ax{border:0; background:none; color:var(--t3); cursor:pointer; font-size:14px;}
  .anniv.pinned{background:var(--fill2); border-radius:var(--r-sm); padding:11px 13px; border-bottom:0; margin-bottom:6px;}
  .anniv.pinned .al,.anniv.pinned .ad{color:var(--accent);}
  .chkrow{display:flex !important; align-items:center; gap:8px; font-size:14px; color:var(--t2); margin-top:14px;}
  .chkrow input{width:18px; height:18px; accent-color:var(--accent);}

  /* ---------- 달력 ---------- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head .mtitle{font-size:17px; font-weight:700; letter-spacing:-.02em;}
  .cal-nav{border:0; background:var(--fill); color:var(--accent); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:18px; font-weight:600; display:grid; place-items:center; line-height:1; padding:0 0 2px;}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .gd{text-align:center; font-size:11px; font-weight:600; color:var(--t3); padding:4px 0 6px; letter-spacing:.02em;}
  .gd.sun{color:var(--red);} .gd.sat{color:var(--t2);}
  .cell{min-height:50px; border-radius:10px; padding:4px 0 3px; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; border:0; overflow:hidden;}
  .cell.blank{cursor:default;}
  .cell .dn{display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; font-size:15px; font-weight:500; color:var(--ink); font-variant-numeric:tabular-nums; padding:0;}
  .cell .dn.sun,.cell .dn.hol{color:var(--red);} .cell .dn.sat{color:var(--t2);}
  .cell.today .dn{background:var(--accent); color:#fff; font-weight:700;}
  .holname.anv{color:var(--both);}
  .holname{font-size:8.5px; color:var(--red); font-weight:600; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .cell .cdots{display:flex; justify-content:center; gap:3px; margin-top:3px; min-height:6px;}
  .cell .cdots i{width:6px; height:6px; border-radius:50%; display:block;}
  .cell .ev,.cell .more{display:none;}
  .cell.trip{background:var(--accent-soft);}
  .trip-dot{font-size:9px; line-height:1.1;}
  #calGrid{touch-action:pan-y;}

  /* ---------- 할 일 · 위시 (Reminders 스타일 원형 체크) ---------- */
  .todo{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--sep);}
  .todo:last-child{border-bottom:0;}
  .todo .chk{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--t4); cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; transition:background-color .2s ease,border-color .2s ease;}
  .todo.done .chk{background:var(--accent); border-color:var(--accent);}
  .todo .tx{flex:1; font-size:15px;}
  .todo.done .tx{text-decoration:line-through; color:var(--t3);}
  .todo .del{border:0; background:none; color:var(--t3); cursor:pointer; font-size:14px;}
  .todo .wb{flex:none; font-size:11px; font-weight:600; color:#fff; padding:3px 9px; border-radius:999px; cursor:pointer;}

  /* ---------- 한마디 ---------- */
  .memo{padding:11px 0; border-bottom:1px solid var(--sep);}
  .memo:last-child{border-bottom:0;}
  .memo .mw{font-weight:600; font-size:12.5px; margin-bottom:3px;}
  .memo .mtx{font-size:15px; color:var(--ink); line-height:1.5;}
  .memo .mt{font-size:11.5px; color:var(--t3); margin-top:4px; font-variant-numeric:tabular-nums;}

  /* ---------- 누구 칩 · 입력줄 ---------- */
  .who{display:flex; gap:6px; align-items:center; margin:10px 0; flex-wrap:wrap;}
  .who .wl{font-size:12.5px; color:var(--t3); margin-right:2px; font-weight:500;}
  .who button{border:0; background:var(--fill); border-radius:999px; padding:7px 13px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; color:var(--t2);}
  .who button.on{color:#fff; font-weight:600;}
  .irow{display:flex; gap:8px; margin-top:12px;}
  .irow input[type=text]{flex:1; min-width:0; border:0; background:var(--fill2); border-radius:var(--r-sm); padding:12px 14px; font:inherit; font-size:16px; outline:0; color:var(--ink); transition:box-shadow .2s ease;}
  .irow input[type=text]:focus{box-shadow:0 0 0 2px var(--accent) inset;}
  input::placeholder,textarea::placeholder{color:var(--t3);}
  .add{border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:15px; padding:12px 18px; border-radius:var(--r-sm); cursor:pointer; flex:none;}

  /* ---------- 모달 · 바텀시트 ---------- */
  .ov{position:fixed; inset:0; background:var(--ov); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:18px; z-index:50;}
  .ov.open{display:flex;}
  .modal{background:var(--card); border-radius:var(--r-lg); padding:20px; width:100%; max-width:380px; max-height:86vh; overflow:auto; box-shadow:var(--sh-lg);}
  .modal h3{margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:-.02em;}
  .modal .msub{font-size:13px; color:var(--t2); margin-bottom:14px;}
  .modal label{display:block; font-size:12.5px; color:var(--t2); font-weight:600; margin:14px 0 6px; letter-spacing:0;}
  .modal input[type=text],.modal input[type=date]{width:100%; border:0; background:var(--fill2); border-radius:var(--r-sm); padding:12px 13px; font:inherit; font-size:16px; outline:0; color:var(--ink);}
  .modal input:focus{box-shadow:0 0 0 2px var(--accent) inset;}
  .ov.sheetov{align-items:flex-end; justify-content:center; padding:0;}
  .sheetov .modal{border-radius:22px 22px 0 0; max-width:500px; width:100%; max-height:92vh; padding-top:6px; will-change:transform;}
  .sheetov.open .modal{animation:sheetUp .42s var(--ease);}
  @keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
  .sheet-grip{width:36px; height:5px; border-radius:3px; background:var(--t4); margin:6px auto 14px; flex:none; cursor:grab; touch-action:none;}
  .sheet-grip:active{cursor:grabbing; background:var(--t3);}
  .daylist{margin:6px 0 2px;}
  .dayev{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--sep); font-size:14.5px;}
  .dayev .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .dayev .dt{flex:1;} .dayev .dx{border:0; background:none; color:var(--t3); cursor:pointer; font-size:14px;}
  .catgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:4px;}
  .catbtn{border:0; background:var(--fill2); border-radius:14px; padding:14px 6px; font:inherit; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; gap:6px; align-items:center;}
  .catbtn .ce{font-size:22px; line-height:1;}
  .catbtn:active{background:var(--fill3);}
  .submeet{margin-top:9px;}
  .submeet .placein,.evedit .placein{width:100%; border:0; background:var(--fill2); border-radius:var(--r-sm); padding:12px 14px; font:inherit; font-size:16px; outline:0; margin-bottom:8px; color:var(--ink);}
  .submeet .placein:focus,.evedit .placein:focus{box-shadow:0 0 0 2px var(--accent) inset;}
  .submeet-row{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .subbtn{border:0; background:var(--accent-soft); border-radius:var(--r-sm); padding:13px; font:inherit; font-weight:600; font-size:14px; color:var(--accent); cursor:pointer;}
  .subbtn.full{width:100%; margin-top:8px;}
  .subbtn.ghost2{background:var(--fill); color:var(--t2);}
  .subbtn:active{background:var(--fill3);}
  .mbtns{display:flex; gap:8px; margin-top:18px;}
  .evedit{background:var(--fill2); border-radius:14px; padding:12px; margin:7px 0 10px;}
  .evedit .placein{background:var(--card);}
  .btn{flex:1; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:15px; padding:13px; border-radius:var(--r-sm); cursor:pointer;}
  .btn.ghost{background:var(--fill); color:var(--ink);}

  /* ---------- 데이트 후기 ---------- */
  .revview{font-size:13px; color:var(--t2); margin-top:2px;}
  .revbox{margin:2px 0 8px; padding:12px; background:var(--fill2); border-radius:14px;}
  .stars{display:flex; gap:4px; font-size:24px; cursor:pointer; user-select:none;}
  .stars span{color:var(--t4);}
  .stars span.on{color:var(--yellow);}
  .revbox input{width:100%; border:0; background:var(--card); border-radius:10px; padding:11px 12px; font:inherit; font-size:15px; outline:0; margin-top:8px; color:var(--ink);}
  .revbox input:focus{box-shadow:0 0 0 2px var(--accent) inset;}

  /* ---------- 마음 전하기 ---------- */
  .mkmsg-in{width:100%; border:0; background:var(--fill2); border-radius:var(--r-sm); padding:12px 14px; font:inherit; font-size:15px; outline:0; margin:6px 0 2px; color:var(--ink);}
  .mkmsg-in:focus{box-shadow:0 0 0 2px var(--accent) inset;}
  .mkbtns{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .mkbtn{border:0; background:var(--fill2); border-radius:14px; padding:12px 6px; font:inherit; font-weight:600; font-size:13.5px; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;}
  .mkbtn .be{font-size:22px; line-height:1;}
  .mkbtn:active{background:var(--fill3);}
  .mklog{margin-top:12px;}
  .mkitem{display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid var(--sep); font-size:14px;}
  .mkitem:last-child{border-bottom:0;}
  .mkitem.fresh{background:var(--accent-soft); border-radius:10px;}
  .mkitem .mke{font-size:18px; flex:none;}
  .mkitem .mkt{margin-left:auto; font-size:11.5px; color:var(--t3); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .mkitem .mkx{border:0; background:none; color:var(--t3); cursor:pointer; font-size:14px; flex:none; padding:0 0 0 2px;}

  /* ---------- 여행 (지난 여행 추억 · 여행 계획 공용) ---------- */
  .trip-grp{font-size:12.5px; font-weight:600; color:var(--t3); margin:12px 2px 7px;}
  .trip-grp:first-child{margin-top:2px;}
  .trip-item{display:flex; align-items:center; gap:11px; text-decoration:none; color:var(--ink); background:var(--fill2); border:0; border-radius:14px; padding:12px 13px; margin-bottom:9px;}
  .trip-item:active{opacity:.6;}
  .trip-item .ti-emoji{font-size:24px; flex:none;}
  .trip-item .ti-tx{display:flex; flex-direction:column; flex:1; line-height:1.35;}
  .trip-item .ti-tx b{font-size:14.5px; font-weight:600; color:var(--ink);}
  .trip-item .ti-sub{font-size:12px; color:var(--t3);}
  .trip-item .ti-go{font-size:20px; color:var(--t4); flex:none;}

  #photoList .feed-month{display:flex; align-items:center; font-size:15px; font-weight:700; color:var(--ink); margin:4px 0 4px; padding:10px 2px; cursor:pointer; -webkit-user-select:none; user-select:none; border-bottom:1px solid var(--sep);}

  .imgov .imgx{position:fixed; top:calc(env(safe-area-inset-top) + 12px); right:16px; z-index:62; background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:50%; width:42px; height:42px; font-size:20px; line-height:1; cursor:pointer;}
  .imgov .imghint{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 14px); text-align:center; color:rgba(255,255,255,.72); font-size:12px; pointer-events:none; z-index:62;}

  /* ---------- 하단 탭바 (유리) ---------- */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:40; max-width:480px; margin:0 auto;
    display:flex; align-items:flex-start; justify-content:space-around;
    padding:8px 6px calc(10px + env(safe-area-inset-bottom));
    background:var(--glass); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid var(--glass-b);}
  .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    border:0; background:none; color:var(--t3); font:inherit; font-size:10px; font-weight:500; padding:4px 0; cursor:pointer; letter-spacing:0;}
  .tabbar button svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round;}
  .tabbar button.on,.tabbar button:active{color:var(--accent);}
  @media (prefers-reduced-transparency: reduce){ .tabbar,.glassbar,.celeb-toast{background:var(--card); -webkit-backdrop-filter:none; backdrop-filter:none;} .ov{-webkit-backdrop-filter:none; backdrop-filter:none;} }

  /* ---------- 스크롤 시 나타나는 컴팩트 유리 헤더 ---------- */
  .glassbar{position:fixed; top:0; left:0; right:0; z-index:60; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 18px 10px; background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--glass-b); transform:translateY(-101%); opacity:0;
    transition:transform .38s var(--ease), opacity .3s ease; pointer-events:none;}
  .glassbar.show{transform:translateY(0); opacity:1;}
  .glassbar .gb-title{font-weight:600; font-size:16px; color:var(--ink); letter-spacing:-.01em; white-space:nowrap;}
  .glassbar .gb-title b{color:var(--accent); font-weight:600;}

  /* ---------- 등장 · 누름 피드백 · 축하 ---------- */
  .ritem{opacity:0; transform:translateY(14px); will-change:opacity,transform; transition:opacity .5s var(--ease), transform .6s var(--ease);}
  .reveal.in .ritem{opacity:1; transform:none;}
  button,.cell,.todo .chk,.del,.story,.mini-add{transition:transform .12s var(--ease), background-color .18s ease, color .18s ease, opacity .15s ease;}
  button:active,.fold-head:active,.story:active{transform:scale(.96);}
  .cell:active{transform:scale(.94);}
  .todo .chk:active{transform:scale(.88);}
  #hearts,b.pop{display:none;}
  .confetti{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden;}
  .confetti i{position:absolute; top:-4vh; border-radius:2px; animation:cfall linear forwards; opacity:.95;}
  @keyframes cfall{to{transform:translateY(112vh) rotate(720deg); opacity:.55;}}
  .celeb-toast{position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:95;
    background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
    color:var(--ink); border:1px solid var(--glass-b); border-radius:999px; padding:11px 18px; font-weight:600; font-size:14.5px;
    box-shadow:var(--sh-lg); white-space:nowrap; animation:celebIn .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes celebIn{from{transform:translateX(-50%) translateY(-26px) scale(.9); opacity:0;} to{transform:translateX(-50%); opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .ritem{opacity:1 !important; transform:none !important; transition:none;}
    button,.cell,.todo .chk,.del,.story,.mini-add{transition:none;}
    button:active,.cell:active,.fold-head:active,.story:active,.todo .chk:active{transform:none;}
    .sheetov.open .modal{animation:none;} .glassbar{transition:opacity .2s ease; transform:none;}
    .hero .bar i{transition:none;}
  }
</style>
</head>

function upcomingMarks(n){
  const anv=midnight(parseD(SET.anniv)), today=midnight(new Date());

  [100,200,300,500,1000,2000,3000].forEach(k=>{ const dt=new Date(anv.getTime()+(k-1)*DAY); marks.push({label:k+"일", date:dt}); });
  for(let y=1;y<=20;y++){ const dt=new Date(anv.getFullYear()+y,anv.getMonth(),anv.getDate()); marks.push({label:y+"주년", date:dt}); }
  return marks.map(m=>({...m, left:Math.round((midnight(m.date)-today)/DAY)}))
              .filter(m=>m.left>=0).sort((a,b)=>a.left-b.left).slice(0,n);

(function(){
  var ov=document.getElementById("imgOv"), img=document.getElementById("imgOvImg");
  var scale=1, tx=0, ty=0, startDist=0, startScale=1, baseTx=0, baseTy=0;
  var panning=false, panX=0, panY=0, moved=false, pinched=false, lastTap=0, tapTimer=null;
  function apply(){ img.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")"; }
  function reset(){ scale=1; tx=0; ty=0; img.style.transition="none"; apply(); }
  function closeOv(){ ov.classList.remove("open"); }
  window.showBig=function(src){ img.src=src; reset(); ov.classList.add("open"); };
  function d2(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  img.addEventListener("touchstart", function(e){
    img.style.transition="none"; moved=false;
    if(e.touches.length===2){ pinched=true; startDist=d2(e.touches); startScale=scale; panning=false; }
    else if(e.touches.length===1 && scale>1){ panning=true; panX=e.touches[0].clientX; panY=e.touches[0].clientY; baseTx=tx; baseTy=ty; }
  }, {passive:false});
  img.addEventListener("touchmove", function(e){
    if(e.touches.length===2){ e.preventDefault(); moved=true; if(startDist>0){ scale=Math.max(1, Math.min(7, startScale*(d2(e.touches)/startDist))); apply(); } }
    else if(e.touches.length===1 && panning){ e.preventDefault(); moved=true; tx=baseTx+(e.touches[0].clientX-panX); ty=baseTy+(e.touches[0].clientY-panY); apply(); }
  }, {passive:false});
  img.addEventListener("touchend", function(e){
    if(e.touches.length>0) return;
    panning=false;
    if(scale<1.03){ scale=1; tx=0; ty=0; img.style.transition="transform .15s"; apply(); }
    if(pinched){ pinched=false; return; }
    if(moved) return;
    var now=Date.now();
    if(now-lastTap<300){ if(tapTimer){ clearTimeout(tapTimer); tapTimer=null; } lastTap=0; img.style.transition="transform .18s"; if(scale>1){ scale=1; tx=0; ty=0; } else { scale=2.6; } apply(); }
    else { lastTap=now; tapTimer=setTimeout(function(){ tapTimer=null; if(scale<=1.01) closeOv(); }, 300); }

  ov.addEventListener("click", function(e){ if(e.target===ov) closeOv(); });
  document.getElementById("imgX").onclick=closeOv;
})();

    c.appendChild(x); cwrap.appendChild(c);

  const irow=document.createElement("div"); irow.className="cmt-input";

  ["a","b"].forEach(k=>{ const b=document.createElement("button"); b.textContent=(k==="a"?SET.a:SET.b); b.onclick=()=>{ lwho=k; issueWho=k; paintW(); }; wsel.appendChild(b); btns[k]=b; });

  paintW();

  const add=()=>{ const t=inp.value.trim(); if(!t||!db) return; db.ref(pathBase+"/comments").push({who:lwho, text:t, t:Date.now()}); inp.value=""; };

function catShort(e){
  if(e.cat==="date") return "데이트";
  if(e.cat==="exercise") return "운동";
  if(e.cat==="meet") return "약속";
  if(e.cat==="trip") return "출장";
  return e.title||"일정";
}
function catLabel(e){
  if(e.cat==="date") return "💕 데이트"+(e.rating?(" ⭐"+e.rating):"")+(e.place?(" 📍"+e.place):"");
  if(e.cat==="exercise") return "💪 운동";
  if(e.cat==="meet") return "🤝 약속·"+(e.meet==="all"?"동성이성":(e.meet==="mixed"?"이성":"동성"))+(e.place?(" 📍"+e.place):"");
  if(e.cat==="trip") return "✈️ 출장"+(e.time?(" "+e.time):"")+(e.place?(" 📍"+e.place):"");
  return e.title||"일정"; /* 옛 자유입력 일정 호환 */
}
function openDay(ds){ curDay=ds; const dt=parseD(ds);
  const wk=["일","월","화","수","목","금","토"][dt.getDay()];
  document.getElementById("dayTitle").textContent=(dt.getMonth()+1)+"월 "+dt.getDate()+"일 ("+wk+")";
  const hn=HOLIDAYS[ds];
  const parts=[]; if(hn) parts.push("🎉 "+hn);
  fixedAnnivs().filter(a=>a.cal).forEach(a=>{ const ad=parseD(a.date);
    const hit = a.yearly ? (ad.getMonth()===dt.getMonth() && ad.getDate()===dt.getDate()) : ymd(ad)===ds;
    if(!hit) return;
    if(a.kind==="anniv"){ const yrs=dt.getFullYear()-ad.getFullYear(); parts.push(a.label+" "+(yrs>0?yrs+"주년":"시작한 날")); }
    else parts.push((a.who==="a"||a.who==="b")?"🎂 "+a.label:a.label); });
  document.getElementById("dayHol").textContent = parts.length ? parts.join(" · ") : "이 날의 일정이에요";
  renderDayList(); renderEvWho(); renderCats();
  document.getElementById("dayOv").classList.add("open");
}

/* ---- 기념일·생일 ---- */
function annivNext(a){
  const base=parseD(a.date), today=midnight(new Date());
  let next = a.yearly ? new Date(today.getFullYear(), base.getMonth(), base.getDate()) : base;
  if(a.yearly && midnight(next)<today) next=new Date(today.getFullYear()+1, base.getMonth(), base.getDate());
  return {next:midnight(next), left:Math.round((midnight(next)-today)/DAY)};
}
function renderAnnivs(){
  const box=document.getElementById("annivList");
  box.innerHTML="";
  /* 고정(사귄 날·두 사람 생일·다음 마일스톤) + 직접 등록한 기념일 → 가까운 순 */
  const arr=allAnnivs().map(a=>Object.assign({},a,annivNext(a))).filter(a=>a.yearly||a.left>=0).sort((x,y)=>x.left-y.left);
  arr.forEach(a=>{ const r=document.createElement("div"); r.className="anniv"+(a.fixed?" fixed":"");
    r.innerHTML='<span class="dot" style="background:'+(COL[a.who]||COL.both)+'"></span>'+
      '<span class="al">'+esc(a.label)+' <small>'+ymd(a.next).slice(5).replace("-",".")+(a.yearly?" · 매년":"")+'</small></span>'+
      '<span class="ad">'+(a.left===0?"오늘":"D-"+a.left)+'</span>';
    if(a.fixed){ box.appendChild(r); return; } /* 고정 기념일은 삭제 불가 */
    /* 직접 등록한 기념일은 행 길게 누르기(0.6초)로 삭제 */
    let ht=null;
    const arm=()=>{ ht=setTimeout(()=>{ if(confirm('"'+a.label+'" 기념일을 삭제할까요?') && db && a.id) db.ref(ROOT+"/anniversaries/"+a.id).remove(); }, 600); };
    const off=()=>clearTimeout(ht);
    r.addEventListener("touchstart",arm,{passive:true}); r.addEventListener("mousedown",arm);
    ["touchend","touchmove","mouseup","mouseleave"].forEach(ev=>r.addEventListener(ev,off));
    box.appendChild(r);
  });
}

function compressImage(file, cb, opt){
  const MAX=(opt&&opt.max)||1600, Q=(opt&&opt.q)||0.85;
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image();
    img.onload=()=>{ let w=img.width, h=img.height, tw=w, th=h;
      if(tw>th && tw>MAX){ th=Math.round(th*MAX/tw); tw=MAX; } else if(th>=tw && th>MAX){ tw=Math.round(tw*MAX/th); th=MAX; }
      /* 큰 사진은 절반씩 단계 축소 — 한 번에 줄일 때 생기는 계단·물결 현상 방지 */
      let cur=img, cw=w, ch=h;
      while(cw/2>tw){
        const c=document.createElement("canvas"); c.width=Math.round(cw/2); c.height=Math.round(ch/2);
        const cx=c.getContext("2d"); cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
        cx.drawImage(cur,0,0,c.width,c.height);
        cur=c; cw=c.width; ch=c.height;
      }
      const cv=document.createElement("canvas"); cv.width=tw; cv.height=th;
      const ctx=cv.getContext("2d"); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
      ctx.drawImage(cur,0,0,tw,th);
      cb(cv.toDataURL("image/jpeg",Q));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  db.ref(ROOT+"/todos").on("value",s=>{ const v=s.val()||{}; TODOS=Object.keys(v).map(k=>Object.assign({id:k},v[k])); renderTodos(); });
  db.ref(ROOT+"/memos").on("value",s=>{ const v=s.val()||{}; MEMOS=Object.keys(v).map(k=>Object.assign({id:k},v[k])); renderMemos(); });
  db.ref(ROOT+"/anniversaries").on("value",s=>{ const v=s.val()||{}; ANNIVS=Object.keys(v).map(k=>Object.assign({id:k},v[k])); renderAnnivs(); renderStories(); });
  db.ref(ROOT+"/wishes").on("value",s=>{ const v=s.val()||{}; WISHES=Object.keys(v).map(k=>Object.assign({id:k},v[k])); renderWishes(); });
  setInterval(renderDday, 60000);
}
start();

/* ---- 스크롤 등장 애니메이션 (Apple 스타일 · 순방향 1회 + 요소 stagger) ---- */
(function(){
  const conts=[...document.querySelectorAll(".hero,.card")];
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!("IntersectionObserver" in window)||reduce){ conts.forEach(c=>c.classList.add("in")); return; }
  conts.forEach(cont=>{
    cont.classList.add("reveal");
    [...cont.children].forEach((ch,i)=>{ ch.classList.add("ritem"); ch.style.transitionDelay=(i*0.07)+"s"; }); /* 항목마다 조금씩 늦게 → cascade */
  });
  /* 화면에 들어오면 한 번 등장 후 유지 (순방향만, 역주행 재생 없음) */
  const io=new IntersectionObserver((ents)=>{ ents.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }); }, {threshold:0.04, rootMargin:"0px 0px -2% 0px"});
  conts.forEach(c=>io.observe(c));
})();

/* ===== Apple 인터랙션 : 바텀시트 드래그 · 달력 스와이프(관성) · 스크롤 유리헤더 ===== */
(function(){
  function spring(from,to,v0,onU,onD){ var x=from,v=v0||0,k=170,c=26,last=performance.now(),raf;
    function step(t){ var dt=(t-last)/1000; if(dt>0.032)dt=0.032; last=t; var a=-k*(x-to)-c*v; v+=a*dt; x+=v*dt; onU(x);
      if(Math.abs(x-to)<0.4 && Math.abs(v)<8){ onU(to); if(onD)onD(); return; } raf=requestAnimationFrame(step); }
    raf=requestAnimationFrame(step); return function(){ cancelAnimationFrame(raf); }; }

  /* 1) 바텀시트 — 그립을 아래로 끌면 속도 실어 닫힘, 살짝이면 스프링 복귀 */
  ["dayOv","setOv","annivOv"].forEach(function(id){
    var ov=document.getElementById(id); if(!ov) return; var modal=ov.querySelector(".modal"); if(!modal) return;
    ov.classList.add("sheetov");
    var grip=document.createElement("div"); grip.className="sheet-grip"; modal.insertBefore(grip, modal.firstChild);
    var drag=false, sy=0, cy=0, ly=0, lt=0, vel=0, stop=null;
    function setY(y){ cy=y; modal.style.transform="translateY("+Math.max(0,y)+"px)"; }
    function doClose(){ if(stop)stop(); var h=modal.offsetHeight+60; stop=spring(cy,h,vel,setY,function(){ ov.classList.remove("open"); modal.style.transform=""; modal.style.transition=""; cy=0; }); }
    function doReset(){ if(stop)stop(); stop=spring(cy,0,vel,setY,function(){ modal.style.transform=""; }); }
    grip.addEventListener("pointerdown",function(e){ drag=true; sy=e.clientY; cy=0; ly=e.clientY; lt=performance.now(); vel=0; if(stop)stop(); modal.style.transition="none"; try{grip.setPointerCapture(e.pointerId);}catch(_){} });
    grip.addEventListener("pointermove",function(e){ if(!drag) return; var dy=e.clientY-sy; if(dy<0) dy*=0.28; setY(dy); var now=performance.now(),d=(now-lt)/1000; if(d>0){ vel=(e.clientY-ly)/d; ly=e.clientY; lt=now; } });
    function endDrag(){ if(!drag) return; drag=false; var h=modal.offsetHeight; var proj=cy+vel*0.14; if(proj>h*0.3 || vel>700){ doClose(); } else { doReset(); } }
    grip.addEventListener("pointerup",endDrag); grip.addEventListener("pointercancel",endDrag);
  });

  /* 2) 달력 스와이프 — 좌우로 밀면 월 전환, 슬라이드 애니메이션 */
  var grid=document.getElementById("calGrid");
  if(grid && typeof renderCal==="function"){
    function slideMonth(dir){
      grid.style.transition="transform .16s ease, opacity .16s ease";
      grid.style.transform="translateX("+(dir>0?-36:36)+"px)"; grid.style.opacity="0";
      setTimeout(function(){
        if(dir>0){ viewM++; if(viewM>11){viewM=0;viewY++;} } else { viewM--; if(viewM<0){viewM=11;viewY--;} }
        renderCal();
        var g=document.getElementById("calGrid");
        g.style.transition="none"; g.style.transform="translateX("+(dir>0?36:-36)+"px)"; g.style.opacity="0";
        requestAnimationFrame(function(){ g.style.transition="transform .3s cubic-bezier(.22,1,.36,1), opacity .28s ease"; g.style.transform="translateX(0)"; g.style.opacity="1"; });
      },140);
    }
    var x0=0,y0=0,on=false,sw=false,sv=0,lx=0,lt=0;
    grid.addEventListener("pointerdown",function(e){ on=true; sw=false; x0=e.clientX; y0=e.clientY; lx=e.clientX; lt=performance.now(); });
    grid.addEventListener("pointermove",function(e){ if(!on) return; var dx=e.clientX-x0, dy=e.clientY-y0;
      if(!sw && Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.2){ sw=true; try{grid.setPointerCapture(e.pointerId);}catch(_){} }
      if(sw){ var now=performance.now(),d=(now-lt)/1000; if(d>0){ sv=(e.clientX-lx)/d; lx=e.clientX; lt=now; } } });
    function endSw(e){ if(!on) return; on=false; if(!sw) return; var dx=(e.clientX||lx)-x0; var dir=(dx<0||sv<-450)?1:-1; slideMonth(dir); }
    grid.addEventListener("pointerup",endSw); grid.addEventListener("pointercancel",function(){on=false;});
    grid.addEventListener("click",function(e){ if(sw){ e.stopPropagation(); e.preventDefault(); sw=false; } },true);
    var pv=document.getElementById("prevM"), nx=document.getElementById("nextM");
    if(pv) pv.onclick=function(){ slideMonth(-1); };
    if(nx) nx.onclick=function(){ slideMonth(1); };
  }

  /* 3) 스크롤 시 유리 헤더 (히어로가 사라지면 나타남) */
  var bar=document.createElement("div"); bar.className="glassbar"; bar.innerHTML='<span class="gb-title"></span>';
  document.body.insertBefore(bar, document.body.firstChild);
  var gt=bar.querySelector(".gb-title");
  function updBar(){ try{ var big=document.getElementById("heroBig"); var nm=(typeof SET!=="undefined")?(SET.b+" & "+SET.a):"우리 캘린더"; gt.innerHTML=esc(nm)+(big?' · <b>'+esc(big.textContent)+'</b>':''); }catch(_){ } }
  var ticking=false;
  window.addEventListener("scroll",function(){ if(ticking) return; ticking=true; requestAnimationFrame(function(){ ticking=false;
    var hero=document.querySelector(".hero"); var b=hero?hero.getBoundingClientRect().bottom:300;
    if(b<44){ if(!bar.classList.contains("show")){ updBar(); bar.classList.add("show"); } } else { bar.classList.remove("show"); }
  }); },{passive:true});
})();

/* 접기 헤더: 스크롤/드래그 뒤엔 토글 방지 (실제 탭만 인식) */
(function(){
  var px=0, py=0, moved=false;
  document.addEventListener("pointerdown",function(e){ px=e.clientX; py=e.clientY; moved=false; }, true);
  document.addEventListener("pointermove",function(e){ if(Math.abs(e.clientX-px)>10 || Math.abs(e.clientY-py)>10) moved=true; }, true);
  document.addEventListener("click",function(e){ if(moved && e.target && e.target.closest && e.target.closest(".fold-head")){ e.stopPropagation(); e.preventDefault(); } }, true);
})();
</script>

<script>
/* ---- 다크 모드(21시~06시 자동) · 기념일 축하 · 상대 접속 알림 ---- */
(function(){
  const reduce=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 밤(21~06시)엔 다크 토큰. 시스템 다크 모드는 CSS(prefers-color-scheme)가 따로 처리 */
  function applyNight(){ const h=new Date().getHours(); document.body.classList.toggle("night",(h>=21||h<6)); }
  applyNight(); setInterval(applyNight,60000);

  /* 기념일·마일스톤 당일 컨페티 + 토스트 (기기당 하루 1회) */
  function confetti(){
    if(reduce) return;
    const cols=["#007AFF","#FF9500","#34C759","#5856D6","#FF3B30","#FFCC00"];
    const box=document.createElement("div"); box.className="confetti"; document.body.appendChild(box);
    for(let i=0;i<80;i++){
      const p=document.createElement("i");
      p.style.left=(Math.random()*100)+"vw";
      p.style.background=cols[i%cols.length];
      p.style.width=(6+Math.random()*5)+"px"; p.style.height=(9+Math.random()*7)+"px";
      p.style.animationDuration=(2.2+Math.random()*2)+"s";
      p.style.animationDelay=(Math.random()*1.4)+"s";
      box.appendChild(p);
    }
    setTimeout(function(){ box.remove(); },6200);
  }
  function toast(msg){
    const t=document.createElement("div"); t.className="celeb-toast"; t.textContent=msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); },6000);
  }
  function maybeCelebrate(){
    try{
      if(typeof SET==="undefined"||!SET.anniv) return;
      const t=midnight(new Date()), key=ymd(t);
      if(localStorage.getItem("celebrated")===key) return;
      let msg=null;
      const anv=midnight(parseD(SET.anniv));
      const dday=Math.round((t-anv)/DAY)+1;
      if(dday>0){
        if([100,200,300,500,1000,2000,3000].indexOf(dday)>=0) msg="우리 "+dday+"일이에요!";
        else if(t.getMonth()===anv.getMonth()&&t.getDate()===anv.getDate()&&t.getFullYear()>anv.getFullYear())
          msg="우리 "+(t.getFullYear()-anv.getFullYear())+"주년이에요!";
      }
      if(!msg && typeof ANNIVS!=="undefined"){
        (typeof allAnnivs==="function"?allAnnivs():ANNIVS).forEach(function(a){ if(msg||!a.date) return; const d=parseD(a.date);
          if(a.yearly ? (d.getMonth()===t.getMonth()&&d.getDate()===t.getDate()) : ymd(d)===key) msg=a.label; });
      }
      if(msg){ localStorage.setItem("celebrated",key); confetti(); toast("🎉 "+msg); }
    }catch(e){}
  }
  setTimeout(maybeCelebrate,2500); setInterval(maybeCelebrate,30000);

  /* 상대 기기가 들어오면 토스트 */
  let presenceReady=false;
  function setupPresence(){
    if(presenceReady || typeof db==="undefined" || !db) return;
    presenceReady=true;
    let cid=localStorage.getItem("coupleClientId");
    if(!cid){ cid="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); localStorage.setItem("coupleClientId",cid); }
    const myRef=db.ref(ROOT+"/presence/"+cid);
    db.ref(".info/connected").on("value",function(s){
      if(s.val()){ myRef.onDisconnect().remove(); myRef.set({t:Date.now()}); }
    });
    setInterval(function(){ myRef.update({t:Date.now()}); },240000);
    let others=-1;
    db.ref(ROOT+"/presence").on("value",function(s){
      const v=s.val()||{}, fresh=Date.now()-15*60000;
      const n=Object.keys(v).filter(function(k){ return k!==cid && v[k] && v[k].t>fresh; }).length;
      const live=document.getElementById("liveTag");
      if(live && live.className.indexOf("on")>=0)
        live.textContent = n>0 ? "● 둘이 함께 보고 있어요" : "● 실시간 연결됨";
      if(others===0 && n>others) toast("지금 함께 보고 있어요");
      others=n;
    });
  }
  setInterval(setupPresence,3000); setTimeout(setupPresence,1500);
})();
</script>
